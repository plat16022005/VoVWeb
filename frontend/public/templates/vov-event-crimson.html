<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Huyết Ấn Chiến Trường — Valkyria of Veyra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0506;
      --red: #e14d43;
      --red-deep: #8f1d1d;
      --brass: #d4a373;
      --ivory: #f3ebe0;
      --ash: #9f8f8b;

      /* Khung game luôn đúng tỷ lệ 960x600; thu nhỏ theo trang nếu viewport không đủ chỗ */
      --head-h: 60px;
      --foot-h: 44px;
      --stage-w: min(960px, calc(100vw - 120px), calc((100vh - var(--head-h) - var(--foot-h) - 40px) * 1.6));
      --stage-h: calc(var(--stage-w) * 0.625);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ivory);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ===== LỚP BỌC NGOÀI KHUNG GAME ===== */
    .page {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(165, 29, 36, 0.28) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(212, 163, 115, 0.08) 0%, transparent 50%),
        var(--bg);
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.5;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(225, 77, 67, 0.04) 0,
        rgba(225, 77, 67, 0.04) 1px,
        transparent 1px,
        transparent 22px
      );
    }

    .page-frame {
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(212, 163, 115, 0.22);
      outline: 1px solid rgba(225, 77, 67, 0.14);
      outline-offset: -6px;
      pointer-events: none;
    }

    /* Header */
    .page-head {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--head-h);
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid rgba(212, 163, 115, 0.2);
    }

    .head-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--red);
      white-space: nowrap;
    }

    .head-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ivory);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .head-tickets {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 5px 14px;
      border: 1px solid rgba(225, 77, 67, 0.5);
      background: rgba(24, 10, 13, 0.9);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--brass);
      white-space: nowrap;
    }

    .head-tickets strong {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 22px;
      line-height: 1;
      color: var(--ivory);
      letter-spacing: 0.04em;
    }

    /* Footer */
    .page-foot {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--foot-h);
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(212, 163, 115, 0.2);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ash);
    }

    /* Rail dọc hai bên khung game */
    .rail {
      position: absolute;
      top: 50%;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(212, 163, 115, 0.55);
      white-space: nowrap;
    }
    .rail--left  { left: 30px;  transform: translateY(-50%) rotate(180deg); writing-mode: vertical-rl; }
    .rail--right { right: 30px; transform: translateY(-50%);               writing-mode: vertical-rl; }

    /* ===== KHUNG GAME 960x600 ===== */
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--stage-w);
      height: var(--stage-h);
      transform: translate(-50%, -50%);
      background: #060304;
      border: 1px solid rgba(212, 163, 115, 0.5);
      box-shadow:
        0 0 0 5px rgba(10, 5, 6, 1),
        0 0 0 6px rgba(225, 77, 67, 0.45),
        0 28px 80px rgba(0, 0, 0, 0.8);
    }

    .stage-standby {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      pointer-events: none;
    }
    .stage-standby .k {
      font-size: 10px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--red);
    }
    .stage-standby .t {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ivory);
    }
    .stage-standby .m {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ash);
    }

    #unity-canvas {
      position: relative;
      z-index: 5;
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: transparent;
      outline: none;
      touch-action: none;
    }

    /* Màn hình nạp Unity chỉ phủ đúng khung game, không phủ phần trang bọc ngoài */
    #vov-unity-loading-overlay {
      top: 50% !important;
      left: 50% !important;
      right: auto !important;
      bottom: auto !important;
      width: var(--stage-w) !important;
      height: var(--stage-h) !important;
      transform: translate(-50%, -50%) !important;
      background: radial-gradient(circle at 50% 42%, #240c10 0%, #100608 64%, #070304 100%) !important;
    }
    #vov-unity-progress-text {
      font-family: 'Cormorant Garamond', Georgia, serif !important;
      color: var(--red) !important;
    }
    #vov-unity-progress-bar {
      background: linear-gradient(90deg, var(--red-deep), var(--red), var(--brass)) !important;
    }
    #vov-unity-loading-sub { color: var(--brass) !important; }

    /* ===== TOÀN MÀN HÌNH: game phủ 100vw x 100vh, ẩn lớp bọc ngoài ===== */
    body.vov-fullscreen-active .stage,
    body.is-fullscreen .stage {
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      transform: none;
      border: 0;
      box-shadow: none;
    }
    body.vov-fullscreen-active #vov-unity-loading-overlay,
    body.is-fullscreen #vov-unity-loading-overlay {
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      transform: none !important;
    }
    body.vov-fullscreen-active .page-head,
    body.vov-fullscreen-active .page-foot,
    body.vov-fullscreen-active .page-frame,
    body.vov-fullscreen-active .rail,
    body.is-fullscreen .page-head,
    body.is-fullscreen .page-foot,
    body.is-fullscreen .page-frame,
    body.is-fullscreen .rail {
      display: none;
    }

    @media (max-width: 900px) {
      .rail { display: none; }
      .head-tag { display: none; }
      .head-title { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-frame"></div>

    <header class="page-head">
      <span class="head-tag">Huyết Ấn Chiến Trường</span>
      <span class="head-title" data-vov-title>Biên Niên Sự Kiện Veyra</span>
      <span class="head-tickets">Lượt <strong data-vov-tickets>0</strong></span>
    </header>

    <div class="rail rail--left">Valkyria of Veyra</div>
    <div class="rail rail--right">Chỉ Thị Chiến Trường</div>

    <main class="stage" id="vov-stage">
      <div class="stage-standby" id="veyra-standby-plate">
        <div class="k">Valkyria of Veyra</div>
        <div class="t" data-vov-title>Chỉ Thị Sự Kiện Đặc Biệt</div>
        <div class="m">Khung chuẩn 960 × 600</div>
      </div>
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    </main>

    <footer class="page-foot">
      <span id="commander-label">Chỉ Huy: Khách</span>
      <span>Khung chuẩn 960 × 600</span>
    </footer>
  </div>

  <script>
    (function () {
      function unlockBrowserAudio() {
        try {
          var inst = window.unityInstance;
          var ctx = inst && inst.Module && inst.Module.WEBAudio && inst.Module.WEBAudio.audioContext;
          if (ctx && ctx.state === "suspended" && typeof ctx.resume === "function") {
            ctx.resume().catch(function () {});
          }
        } catch (e) {}
      }
      window.addEventListener("pointerdown", unlockBrowserAudio, { passive: true });
      window.addEventListener("keydown", unlockBrowserAudio, { passive: true });

      window.addEventListener("vov:state-updated", function (ev) {
        var d = ev && ev.detail;
        var el = document.getElementById("commander-label");
        if (el && d && d.username) {
          el.textContent = "Chỉ Huy: " + d.username;
        }
      });
    })();
  </script>
</body>
</html>
